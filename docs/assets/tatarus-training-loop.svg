<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">TATARUS Trainingszyklus</title><desc id="desc">Sechs Schritte vom Roboterzustand zur neuronalen Entscheidung und zurück.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071722"/><stop offset="1" stop-color="#102c3a"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56ddff"/></marker><style>.h{font:700 42px 'Segoe UI',Arial;fill:#f4f9fc}.n{font:700 23px 'Segoe UI',Arial;fill:#fff}.b{font:400 17px 'Segoe UI',Arial;fill:#bad0da}.num{font:700 26px 'Segoe UI',Arial;fill:#061722}.box{fill:#123243;stroke:#397089;stroke-width:2}</style></defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg2)"/><text x="70" y="80" class="h">Ein Takt im TATARUS-Lernkreislauf</text>
  <g>
    <g transform="translate(80 180)"><rect class="box" width="330" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#57dfff"/><text x="34" y="51" class="num">1</text><text x="82" y="50" class="n">Umwelt erfassen</text><text x="30" y="91" class="b">Nähe, Zielrichtung, Bewegung,</text><text x="30" y="118" class="b">Batterie und Kontext bilden den Sensorframe.</text></g>
    <g transform="translate(630 135)"><rect class="box" width="340" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#57dfff"/><text x="34" y="51" class="num">2</text><text x="82" y="50" class="n">Neural integrieren</text><text x="30" y="91" class="b">Dendriten, Rezeptoren, Ionen und</text><text x="30" y="118" class="b">Synapsen berechnen den aktuellen Zustand.</text></g>
    <g transform="translate(1180 180)"><rect class="box" width="330" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#b995ff"/><text x="34" y="51" class="num">3</text><text x="82" y="50" class="n">Motorik wählen</text><text x="30" y="91" class="b">Vier Motorpools liefern Aktivität</text><text x="30" y="118" class="b">für Nord, Ost, Süd und West.</text></g>
    <g transform="translate(1180 470)"><rect class="box" width="330" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#b995ff"/><text x="34" y="51" class="num">4</text><text x="82" y="50" class="n">Aktion ausführen</text><text x="30" y="91" class="b">Der Roboter bewegt sich und erzeugt</text><text x="30" y="118" class="b">eine messbare Konsequenz in der Welt.</text></g>
    <g transform="translate(630 515)"><rect class="box" width="340" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#57dfff"/><text x="34" y="51" class="num">5</text><text x="82" y="50" class="n">Ergebnis bewerten</text><text x="30" y="91" class="b">Fortschritt, Kollision und Zielkontakt</text><text x="30" y="118" class="b">erzeugen Reward, Erfolg und Neuheit.</text></g>
    <g transform="translate(80 470)"><rect class="box" width="330" height="150" rx="22"/><circle cx="42" cy="42" r="24" fill="#57dfff"/><text x="34" y="51" class="num">6</text><text x="82" y="50" class="n">Plastizität anwenden</text><text x="30" y="91" class="b">Eligibility, Dopamin und Langzeitprozesse</text><text x="30" y="118" class="b">verändern den folgenden Nervenzustand.</text></g>
  </g>
  <path d="M410 225 C500 225 540 190 630 190" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/><path d="M970 190 C1060 190 1090 225 1180 225" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/><path d="M1345 330 L1345 470" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/><path d="M1180 545 C1090 545 1060 590 970 590" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/><path d="M630 590 C540 590 500 545 410 545" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/><path d="M245 470 C245 410 245 390 245 330" fill="none" stroke="#56ddff" stroke-width="5" marker-end="url(#a)"/>
  <rect x="620" y="340" width="360" height="110" rx="55" fill="#173f51" stroke="#57dfff" stroke-width="2"/><text x="698" y="386" class="n">Gemeinsamer Zustand</text><text x="675" y="420" class="b">ein Seed · eine Uhr · ein Reset</text>
</svg>
